<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation Infotram</title>
<style>
    /* Import des polices style "Écran LCD / Futuriste" */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@400;500;700&display=swap');

    :root {
        --bg-color: #050505;
        --ce1-color: #ff00ff; /* Magenta */
        --ce2-color: #00ffff; /* Cyan */
        --cm1-color: #00ff41; /* Vert Matrix */
        --cm2-color: #bd00ff; /* Violet */
        --6e-color:  #ff9900; /* Orange */
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: var(--bg-color);
        background-image: url('https://i.postimg.cc/yYj23zhR/grok-video-6a00c5c6-f509-477f-a2d7-a8914482175d.gif');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        font-family: 'Roboto', sans-serif;
        color: white;
        margin: 0;
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    /* En-tête et Titre Principal */
    header {
        text-align: center;
        margin-bottom: 20px;
        width: 100%;
    }

    h1 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 5px;
        margin: 0 0 15px 0;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 25px rgba(0, 255, 255, 0.5);
        font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    /* Barre de filtre par jour */
    .day-filters {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 10px;
    }

    .filter-btn {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.8);
        font-family: 'Orbitron', sans-serif;
        font-size: 0.75rem;
        padding: 6px 14px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.25s ease;
        backdrop-filter: blur(4px);
        clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }

    .filter-btn:hover,
    .filter-btn.active {
        background: #ffffff;
        color: #000000;
        border-color: #ffffff;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        font-weight: 700;
    }

    /* Conteneur des groupes de classe */
    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        width: 100%;
        max-width: 1300px;
    }

    /* Chaque colonne de niveau (CE1, CE2...) */
    .grade-group {
        background: rgba(5, 5, 10, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-top: 3px solid var(--theme-color);
        padding: 14px 12px;
        border-radius: 8px;
        flex: 1;
        min-width: 210px;
        max-width: 260px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
    }

    .grade-group:hover {
        transform: translateY(-4px);
        background: rgba(10, 10, 18, 0.88);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9), 0 0 15px var(--theme-color);
    }

    .grade-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.35rem;
        font-weight: 700;
        margin-bottom: 14px;
        padding-bottom: 8px;
        width: 100%;
        color: var(--theme-color);
        text-shadow: 0 0 10px var(--theme-color);
        border-bottom: 1px solid var(--theme-color);
        letter-spacing: 2px;
    }

    /* Design des boutons de classe */
    .btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-decoration: none;
        padding: 10px 12px;
        margin: 6px 0;
        border: 1px solid var(--theme-color);
        color: white;
        background: rgba(0, 0, 0, 0.45);
        box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
        position: relative;
        transition: all 0.25s ease;
        cursor: pointer;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    /* Nom de la classe à gauche */
    .class-name {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 1px;
        color: var(--theme-color);
        transition: color 0.25s ease;
    }

    /* Badge du jour de la semaine à droite */
    .day-badge {
        font-family: 'Roboto', sans-serif;
        font-weight: 700;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 3px 7px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        color: #e0e0e0;
        border: 1px solid var(--theme-color);
        transition: all 0.25s ease;
    }

    /* Effets au survol des boutons */
    .btn:hover {
        background: var(--theme-color);
        box-shadow: 0 0 18px var(--theme-color);
        transform: scale(1.02);
    }

    .btn:hover .class-name {
        color: var(--hover-text, #000);
        text-shadow: none;
    }

    .btn:hover .day-badge {
        background: rgba(0, 0, 0, 0.8);
        color: var(--theme-color);
        border-color: transparent;
    }

    /* Attribution des couleurs par niveau */
    .ce1 { --theme-color: var(--ce1-color); --hover-text: #000; }
    .ce2 { --theme-color: var(--ce2-color); --hover-text: #000; }
    .cm1 { --theme-color: var(--cm1-color); --hover-text: #000; }
    .cm2 { --theme-color: var(--cm2-color); --hover-text: #fff; }
    .six { --theme-color: var(--6e-color);  --hover-text: #000; }

    /* Masquage lors du filtrage */
    .hidden {
        display: none !important;
    }

    /* Adaptation Mobile */
    @media (max-width: 600px) {
        .grade-group {
            min-width: 100%;
            max-width: 100%;
        }
    }
</style>
</head>
<body>

    <header>
        <h1>INFOTRAM</h1>
        <!-- Filtres rapides par jour -->
        <div class="day-filters">
            <button class="filter-btn active" onclick="filterDay('all', this)">Tous les jours</button>
            <button class="filter-btn" onclick="filterDay('lundi', this)">Lundi</button>
            <button class="filter-btn" onclick="filterDay('mardi', this)">Mardi</button>
            <button class="filter-btn" onclick="filterDay('jeudi', this)">Jeudi</button>
            <button class="filter-btn" onclick="filterDay('vendredi', this)">Vendredi</button>
        </div>
    </header>

    <div class="container">

        <!-- CE1 -->
        <div class="grade-group ce1">
            <div class="grade-title">CE1</div>
            <a href="https://sites.google.com/view/infotram/les-classes/ce1/ce1-1-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="lundi">
                <span class="class-name">CE1 1</span>
                <span class="day-badge">Lundi</span>
            </a>
            <a href="https://www.infotram.fr/les-classes/ce1/ce1-2-2025" target="_blank" rel="noopener noreferrer" class="btn" data-days="mardi">
                <span class="class-name">CE1 2</span>
                <span class="day-badge">Mardi</span>
            </a>
            <a href="https://www.infotram.fr/les-classes/ce1/ce1-3-2025" target="_blank" rel="noopener noreferrer" class="btn" data-days="jeudi">
                <span class="class-name">CE1 3</span>
                <span class="day-badge">Jeudi</span>
            </a>
        </div>

        <!-- CE2 -->
        <div class="grade-group ce2">
            <div class="grade-title">CE2</div>
            <a href="https://sites.google.com/view/infotram/les-classes/ce2/ce2-1-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="jeudi">
                <span class="class-name">CE2 1</span>
                <span class="day-badge">Jeudi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/ce2/ce2-2-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="vendredi">
                <span class="class-name">CE2 2</span>
                <span class="day-badge">Vendredi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/ce2/ce-2-3-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="vendredi">
                <span class="class-name">CE2 3</span>
                <span class="day-badge">Vendredi</span>
            </a>
        </div>

        <!-- CM1 -->
        <div class="grade-group cm1">
            <div class="grade-title">CM1</div>
            <a href="https://sites.google.com/view/infotram/les-classes/cm1/cm1-1-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="mardi">
                <span class="class-name">CM1 1</span>
                <span class="day-badge">Mardi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/cm1/cm1-2-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="mardi">
                <span class="class-name">CM1 2</span>
                <span class="day-badge">Mardi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/cm1/cm1-3-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="lundi mardi">
                <span class="class-name">CM1 3</span>
                <span class="day-badge">Lun &bull; Mar</span>
            </a>
        </div>

        <!-- CM2 -->
        <div class="grade-group cm2">
            <div class="grade-title">CM2</div>
            <a href="https://sites.google.com/view/infotram/les-classes/cm-2/cm2-1-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="jeudi">
                <span class="class-name">CM2 1</span>
                <span class="day-badge">Jeudi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/cm-2/cm2-2-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="lundi">
                <span class="class-name">CM2 2</span>
                <span class="day-badge">Lundi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/cm-2/cm2-3-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="lundi">
                <span class="class-name">CM2 3</span>
                <span class="day-badge">Lundi</span>
            </a>
        </div>

        <!-- 6EME -->
        <div class="grade-group six">
            <div class="grade-title">6ème</div>
            <a href="https://sites.google.com/view/infotram/les-classes/6eme/6a-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="vendredi">
                <span class="class-name">6A</span>
                <span class="day-badge">Vendredi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/6eme/6b-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="jeudi">
                <span class="class-name">6B</span>
                <span class="day-badge">Jeudi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/6eme/6c-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="lundi">
                <span class="class-name">6C</span>
                <span class="day-badge">Lundi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/6eme/6d-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="mardi">
                <span class="class-name">6D</span>
                <span class="day-badge">Mardi</span>
            </a>
            <a href="https://sites.google.com/view/infotram/les-classes/6eme/6e-2026" target="_blank" rel="noopener noreferrer" class="btn" data-days="vendredi">
                <span class="class-name">6E</span>
                <span class="day-badge">Vendredi</span>
            </a>
        </div>

    </div>

    <script>
        function filterDay(day, clickedBtn) {
            // Mettre à jour le bouton actif
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            clickedBtn.classList.add('active');

            // Filtrer les boutons de classe et masquer les groupes vides si nécessaire
            document.querySelectorAll('.grade-group').forEach(group => {
                let visibleCount = 0;
                group.querySelectorAll('.btn').forEach(btn => {
                    const days = btn.getAttribute('data-days');
                    if (day === 'all' || days.includes(day)) {
                        btn.classList.remove('hidden');
                        visibleCount++;
                    } else {
                        btn.classList.add('hidden');
                    }
                });
                
                // Optionnel : estomper légèrement le bloc s'il n'a aucun cours ce jour-là
                group.style.opacity = visibleCount === 0 ? '0.35' : '1';
            });
        }
    </script>

</body>
</html>
